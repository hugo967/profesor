<!doctype html>
<!--
  Página de PRUEBA local para ver model.glb con avatar3d.js sin levantar el
  backend. NO se despliega (no la referencia nadie). Borrar cuando ya no
  haga falta.

  Uso:  cd frontend  &&  python -m http.server 8000
        abrir http://localhost:8000/avatar3d-preview.html

  - "Elegir audio…" + texto: reproduce un MP3/WAV local enrutado por un
    AnalyserNode igual que hace app.js con el TTS -> prueba REAL del
    lip-sync por bandas Y de la sincronía de cuerpo con el habla (pausas
    reales + beats de puntuación del texto que se escriba en el cuadro,
    ver avatar-speech-sync.js). El panel "Gestos" de abajo va pintando cada
    cambio de estado con su timestamp: sirve para comprobar a ojo que no
    hay "tirones" (dos cambios pegados en el tiempo) al escuchar audio real.
  - Slider / "Hablar (auto)": mueven la boca por el camino escalar simple
    (sin analizador, sin beats de texto), como cuando Web Audio está
    bloqueada.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview avatar 3D — model.glb</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #e8dfd8; color: #3a2a12; }
    .stage {
      width: 100vw; height: 68vh;
      background: linear-gradient(180deg, #efe8df, #ddcfc0);
      display: flex; align-items: center; justify-content: center;
    }
    #avatar3d-canvas { width: 42%; height: 92%; display: block; }
    @media (max-width: 700px) { #avatar3d-canvas { width: 82%; } }
    .panel { padding: 14px 20px; }
    .row { margin: 9px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input[type=range] { flex: 1; min-width: 160px; }
    textarea { flex: 1; min-width: 240px; font: inherit; padding: 4px 6px; }
    button { font: inherit; padding: 6px 14px; cursor: pointer; }
    #log { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; opacity: .8; }
    #gestureLog {
      font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap;
      max-height: 160px; overflow-y: auto; background: #fffaf2; border: 1px solid #d8c9b4;
      padding: 6px 8px; margin-top: 4px;
    }
    #gestureLog .jerk { color: #b3261e; font-weight: bold; }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div class="stage">
    <canvas id="avatar3d-canvas" aria-label="Avatar del tutor (3D)"></canvas>
  </div>
  <div class="panel">
    <div class="row">
      <input id="file" type="file" accept="audio/*">
      <button id="play">▶︎ Reproducir</button>
      <button id="stopA">■ Parar</button>
    </div>
    <div class="row">
      <textarea id="segText" rows="2" placeholder="Texto del segmento (para los beats de puntuación: comas, puntos, ?). Debe corresponder aprox. al audio elegido arriba.">Well, I think that's a great question. Have you tried speaking English every day? Let's practice a bit more, shall we?</textarea>
    </div>
    <div class="row">
      <label for="vol">Volumen simulado (camino escalar, sin beats de texto)</label>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0">
      <span id="volval">0.00</span>
      <button id="talk">▶︎ Hablar (auto)</button>
      <button id="stop">■</button>
      <button id="swapHands">🤝 Cambiar mano de encima</button>
    </div>
    <div id="log">cargando…</div>
    <div class="row"><strong>Gestos (cuerpo)</strong> — cada línea es un cambio de gesture state; en rojo, dos cambios a menos de 250ms (posible "tirón" a vigilar)</div>
    <div id="gestureLog"></div>
  </div>

  <script type="module">
    const log = (m) => { document.getElementById("log").textContent = m; };
    const canvas = document.getElementById("avatar3d-canvas");
    let Avatar3D = null;

    try {
      const mod = await import("./avatar3d.js");
      const info = await mod.mountAvatar3D(canvas);
      Avatar3D = mod;
      log("montado ✓  " + JSON.stringify(info));
      // ?swap=<ms>: fuerza un cambio de mano a los <ms> (para capturas headless).
      const swapMs = +new URLSearchParams(location.search).get("swap");
      if (swapMs) setTimeout(() => mod.forcePresenterHandSwap(), swapMs);
    } catch (err) {
      log("ERROR al montar: " + (err?.message || err));
      console.error(err);
    }

    // ---- log de gestos: vigila getSpeechSyncDebugState() y pinta cada
    // cambio de gestureState con el tiempo transcurrido desde el anterior,
    // para verificar a ojo que la máquina de estados no "tiembla" (dos
    // cambios pegados) cuando entra audio real. ----
    const gestureLogEl = document.getElementById("gestureLog");
    let lastGestureState = null;
    let lastGestureChangeAt = 0;
    let gestureRafHandle = null;
    const JERK_THRESHOLD_MS = 250; // por debajo de esto, dos cambios seguidos se marcan como sospechosos

    function pollGestureLog() {
      gestureRafHandle = requestAnimationFrame(pollGestureLog);
      if (!Avatar3D || !Avatar3D.getSpeechSyncDebugState) return;
      const state = Avatar3D.getSpeechSyncDebugState();
      if (state.gestureState === lastGestureState) return;
      const now = performance.now();
      const sinceLast = lastGestureState === null ? null : now - lastGestureChangeAt;
      lastGestureState = state.gestureState;
      lastGestureChangeAt = now;
      const line = document.createElement("div");
      const deltaTxt = sinceLast === null ? "" : ` (+${sinceLast.toFixed(0)}ms)`;
      line.textContent =
        `[${(now / 1000).toFixed(2)}s] -> ${state.gestureState}${deltaTxt}` +
        `  beats ${state.beatsFired}/${state.beatsTotal}  paused=${state.paused}`;
      if (sinceLast !== null && sinceLast < JERK_THRESHOLD_MS) line.className = "jerk";
      gestureLogEl.appendChild(line);
      gestureLogEl.scrollTop = gestureLogEl.scrollHeight;
    }
    pollGestureLog();

    // ---- camino REAL: audio local -> AnalyserNode -> avatar ----
    let ac = null, analyser = null, srcNode = null, audioEl = null, rafReal = null;
    const fileInput = document.getElementById("file");
    const segTextEl = document.getElementById("segText");

    function stopReal() {
      if (rafReal) cancelAnimationFrame(rafReal);
      rafReal = null;
      if (audioEl) { audioEl.pause(); }
      if (Avatar3D) Avatar3D.setMouthOpen(0);
    }

    document.getElementById("play").addEventListener("click", async () => {
      const f = fileInput.files?.[0];
      if (!f || !Avatar3D) return;
      stopReal();
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      await ac.resume();
      audioEl = new Audio(URL.createObjectURL(f));
      audioEl.crossOrigin = "anonymous";
      srcNode = ac.createMediaElementSource(audioEl);
      analyser = ac.createAnalyser();
      analyser.fftSize = 256; // igual que app.js
      srcNode.connect(analyser);
      analyser.connect(ac.destination);
      const buf = new Uint8Array(analyser.fftSize);

      // Igual que playNextInQueue() en app.js: el texto se manda ya, la
      // duración real en cuanto el navegador la conoce.
      Avatar3D.beginSpeechSegment(segTextEl.value);
      const applyDuration = () => {
        if (Number.isFinite(audioEl.duration)) Avatar3D.setSpeechSegmentDuration(audioEl.duration);
      };
      if (Number.isFinite(audioEl.duration)) applyDuration();
      else audioEl.addEventListener("loadedmetadata", applyDuration, { once: true });

      const tick = () => {
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        const vol = Math.min(1, Math.sqrt(sum / buf.length) * 2.4);
        Avatar3D.setMouthOpen(vol, analyser, audioEl.currentTime);
        rafReal = requestAnimationFrame(tick);
      };
      audioEl.onended = stopReal;
      await audioEl.play();
      tick();
      log("reproduciendo " + f.name);
    });
    document.getElementById("stopA").addEventListener("click", stopReal);

    // ---- camino escalar simple ----
    const vol = document.getElementById("vol");
    const volval = document.getElementById("volval");
    const set = (v) => {
      vol.value = v;
      volval.textContent = (+v).toFixed(2);
      if (Avatar3D) Avatar3D.setMouthOpen(+v);
    };
    vol.addEventListener("input", () => set(vol.value));

    let talkRaf = null;
    document.getElementById("talk").addEventListener("click", () => {
      if (talkRaf) return;
      const t0 = performance.now();
      const tick = () => {
        const t = (performance.now() - t0) / 1000;
        const v = Math.max(0,
          (0.55 + 0.45 * Math.sin(t * 2.3)) *
          Math.abs(Math.sin(t * 13) * 0.7 + Math.sin(t * 27) * 0.3)) * 0.5;
        set(v);
        talkRaf = requestAnimationFrame(tick);
      };
      tick();
    });
    document.getElementById("swapHands").addEventListener("click", () => {
      if (Avatar3D && Avatar3D.forcePresenterHandSwap) Avatar3D.forcePresenterHandSwap();
    });
    document.getElementById("stop").addEventListener("click", () => {
      if (talkRaf) cancelAnimationFrame(talkRaf);
      talkRaf = null;
      set(0);
    });
  </script>
</body>
</html>
